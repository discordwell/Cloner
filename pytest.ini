[pytest]
# The manual smoke scripts under scripts/ (e.g. test_sora.py,
# test_person_descriptor.py) are named test_*.py but are not pytest tests —
# they drive live services (Sora browser login via playwright, the Google API)
# and are run by hand. Restrict default collection to the real unit-test suite
# so a bare `pytest` at the repo root works without those optional deps.
testpaths = tests
